name: Restaurant Service CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, quickbite, restaurant-service]

    defaults:
      run:
        working-directory: session_07/exercise_04/restaurant-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give permission to Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew bootJar