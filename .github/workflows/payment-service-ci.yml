name: Payment Service CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug project structure
        run: |
          pwd
          ls -la
          ls -la session_07/exercise_03
          ls -la session_07/exercise_03/gradle/wrapper

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Test
        working-directory: session_07/exercise_03
        run: |
          chmod +x ./gradlew
          ls -la gradle/wrapper
          ./gradlew --version
          ./gradlew test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Jar
        working-directory: session_07/exercise_03
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-artifact
          path: session_07/exercise_03/build/libs/*.jar