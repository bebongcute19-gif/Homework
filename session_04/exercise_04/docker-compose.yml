services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service

  user_service:
    image: nginx:alpine
    volumes:
      - ./user/default.conf:/etc/nginx/conf.d/default.conf:ro

  product_service:
    image: nginx:alpine
    volumes:
      - ./product/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: exercise_04_default